[package]
name = "lesson09"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite-bundled"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "sync"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
